<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Ai UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="wrapper">

        <h1 class="heading"><span class="logo">✳</span>Good afternoon,Drona pareek</h1>
        <form action="">
            <div class="card">
                <input type="text" placeholder="How can i help you today ?" />
                <button class="send-btn">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
        </form>
    </div>
    <div class="buttons">

        <button>
            <i class="fa-solid fa-user"></i>
            Filter By Age
        </button>

        <button>
            <i class="fa-solid fa-venus-mars"></i>
            Filter By Gender
        </button>

        <button>
            <i class="fa-solid fa-tv"></i>
            Filter By Channel
        </button>

        <button>
            <i class="fa-solid fa-chart-line"></i>
            Campaign Performance (Last 7 days)
        </button>

        <button>
            <i class="fa-solid fa-bullseye"></i>
            Optimization strategies
        </button>

    </div>


    </div>
</body>

</html>
